[project]
name = "web-rl-env"
version = "0.1.0"
description = "A simple web-based reinforcement learning environment"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "azure-storage-queue>=12.8.0",
    "azure-servicebus",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.55.0",
    "beautifulsoup4>=4.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
