[project]
name = "grader-env-2"
version = "0.1.0"
description = "Second grader environment using LMCache disaggregated inference over the NIXL backend"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
# lmcache >=0.3.7 requires Python >=3.10,<3.14
requires-python = ">=3.10,<3.14"

dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.5.0",
  "azure-servicebus",
  "python-dotenv>=1.0.0",
  "httpx>=0.24.0",

  # vLLM v1 (KVConnector path; no vllm.lmc)
  "vllm>=0.11.0,<0.12",
  # LMCache (v1 connector integration)
  "lmcache>=0.3.7",

  "websocket-client>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
