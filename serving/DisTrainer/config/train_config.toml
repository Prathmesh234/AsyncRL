# DisTrainer Configuration
# Based on TorchTitan architecture patterns

# Model Configuration
# The base model is Qwen3-4B-Thinking (or locally downloaded version)
[model]
name = "Qwen/Qwen3-4B-Thinking-2507"
# Initial adapter from ToolGRPOTrainer checkpoint-10
adapter_path = "./models/policy-0-initial"
use_lora = true
lora_r = 8
lora_alpha = 16
target_modules = ["q_proj", "v_proj", "k_proj", "o_proj"]

# Model architecture type: "dense" for standard transformers, "moe" for Mixture-of-Experts
model_type = "dense"

# MoE-specific settings (only used when model_type = "moe")
# freeze_experts: If true, freeze expert/MLP layers during training
#                 Required when vLLM/sglang don't support LoRA on expert layers
freeze_experts = true

# Training Hyperparameters
[training]
learning_rate = 5e-6
beta = 0.01  # KL penalty coefficient
max_grad_norm = 1.0
num_generations_per_prompt = 4

# Distributed Configuration
[parallel_dims]
dp = 4   # Data parallel across 4 GPUs
tp = 1   # No tensor parallelism
pp = 1   # No pipeline parallelism

[distributed]
backend = "nccl"

# Data Configuration
# Queue mode (default): DisGenerator pushes completed groups to POST /push_group
# and they are held in an in-memory BufferQueue on rank 0 (no disk I/O).
# File mode (use_buffer_queue = false): DisGenerator writes batch_*.jsonl files
# into generations_dir instead.
[data]
generations_dir = "./data/generations"
max_sequence_length = 8192
use_buffer_queue = true
buffer_maxlen = 32

# Checkpoint Configuration
# Policies are saved as: policy-{N}-{YYYYMMDD_HHMMSS}
# DisGenerator auto-detects the latest policy from this directory
[checkpoint]
save_dir = "./models"
save_interval = 1  # Save checkpoint after every batch (1 batch = 1 policy)
keep_latest_k = 3
