# DisTrainer Configuration for MoE Models
# Model: Qwen3-30B-A3B-Thinking (30.5B total, ~3.3B active, 128 experts / 8 active)
# Same family as the dense Qwen3-4B-Thinking base: same tokenizer, chat
# template, and <think> output format, so prompts/rewards need no changes.

# Model Configuration
[model]
name = "Qwen/Qwen3-30B-A3B-Thinking-2507"
# Initial adapter (create this first or set to null for fresh LoRA)
adapter_path = "./models/policy-0-initial"
use_lora = true
lora_r = 8
lora_alpha = 16

# LoRA targets: attention projections + expert MLP projections.
# vLLM >= 0.15 serves expert-layer LoRA via its fused_moe_lora kernel
# (Qwen3-MoE, GPT-OSS, DeepSeek families), so experts no longer need to be
# excluded. PEFT suffix-matching applies gate_proj/up_proj/down_proj to every
# expert; the router (mlp.gate) is intentionally NOT targeted — routers are
# kept frozen for LoRA and vLLM does not apply adapters to them.
target_modules = ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

# Model architecture type: "moe" for Mixture-of-Experts models
model_type = "moe"

# MoE-specific: freeze expert-side weights during training.
# false (default here): train expert LoRA too — requires vLLM >= 0.15 on the
#   DisGenerator servers so the adapter can be hot-swap served.
# true: attention-only training (freezes the expert LoRA params; base weights
#   are already frozen by PEFT). Use this if pinned to an older vLLM.
freeze_experts = false

# Training Hyperparameters
# For MoE models, you may want to adjust learning rate due to smaller trainable params
[training]
learning_rate = 5e-6  # Consider increasing if only training attention layers
beta = 0.01  # KL penalty coefficient
max_grad_norm = 1.0
num_generations_per_prompt = 4

# Distributed Configuration
# For MoE models, you may want more GPUs for expert parallelism (future)
[parallel_dims]
dp = 4   # Data parallel across 4 GPUs
tp = 1   # Tensor parallelism (unused for now)
pp = 1   # Pipeline parallelism (unused for now)
# ep = 1   # Expert parallelism (future feature)

[distributed]
backend = "nccl"

# Data Configuration
# use_buffer_queue = true: in-memory BufferQueue fed via POST /push_group
# use_buffer_queue = false: legacy file-based batch_*.jsonl ingestion
[data]
generations_dir = "./data/generations"
max_sequence_length = 8192  # Trinity Mini supports up to 128K
use_buffer_queue = true
buffer_maxlen = 32

# Checkpoint Configuration
[checkpoint]
save_dir = "./models"
save_interval = 1  # Save after every batch
keep_latest_k = 3

# Notes for MoE Training:
# ----------------------
# 1. freeze_experts=false trains LoRA on attention + all expert projections.
#    Serving that adapter requires vLLM >= 0.15 (fused_moe_lora kernel) on the
#    DisGenerator prefill/decode servers. Set freeze_experts=true to fall back
#    to attention-only adapters that any LoRA-capable vLLM can serve.
# 2. Expert LoRA adapters are large: r=8 over 48 layers x 128 experts x 3
#    projections is ~400M adapter params (~800MB bf16). With --max-loras 3 the
#    generator keeps up to ~2.5GB of adapters in GPU memory — budget for it.
# 3. Start the generator with MODEL="Qwen/Qwen3-30B-A3B-Thinking-2507" so the
#    vLLM servers load the same base model.
# 4. Expert parallelism (EP) is not yet implemented; experts are trained with
#    standard FSDP data parallelism (use more GPUs via dp).
