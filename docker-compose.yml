version: '3.8'

services:
  web-rl-env:
    build: .
    image: ${ACR_REGISTRY:-yourregistry}.azurecr.io/web-rl-env:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ACR_REGISTRY=${ACR_REGISTRY:-yourregistry}
      - IMAGE_TAG=${IMAGE_TAG:-latest}
