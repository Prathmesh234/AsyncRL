services:
    grader-env:
      build: .
      image: ${ACR_REGISTRY:-yourregistry}.azurecr.io/grader-env:${IMAGE_TAG:-latest}
      ports:
        - "8003:8001"
      volumes:
        - ./logger:/app/logger
      restart: unless-stopped
      env_file:
        - .env
      environment:
        - ACR_REGISTRY=${ACR_REGISTRY:-yourregistry}
        - IMAGE_TAG=${IMAGE_TAG:-latest}
        - NVIDIA_VISIBLE_DEVICES=0,1
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 2
                capabilities: [gpu]
